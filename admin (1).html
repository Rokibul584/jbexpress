<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>উপজেলা এক্সপ্রেস অ্যাডমিন</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;700&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f6f4; --surface:#fff; --surface-2:#eaf0ec; --fg:#14231c; --muted:#56695e; --line:#d5dfd8;
  --accent:#0f6b4f; --accent-fg:#fff; --accent-soft:#d9eee4;
  --good:#1b7f4b; --good-bg:#dcf2e5; --warn:#a15c00; --warn-bg:#fdecc8; --bad:#b3261e; --bad-bg:#fbe0dd; --info:#245a9c; --info-bg:#dce9f8;
  --f-head:'Anek Bangla','Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
  --f-body:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1713; --surface:#16231d; --surface-2:#1d2d26; --fg:#e4efe9; --muted:#9bb0a5; --line:#2a3d34;
  --accent:#4cc79a; --accent-fg:#06281b; --accent-soft:#1c3a2e;
  --good:#6fd79c; --good-bg:#1a3a2a; --warn:#f0b955; --warn-bg:#3d3015; --bad:#ff8f86; --bad-bg:#431e1b; --info:#8fbdf2; --info-bg:#1b3250; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2{font-family:var(--f-head);margin:0;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
header.bar{background:var(--accent);color:var(--accent-fg);padding-top:env(safe-area-inset-top,0px)}
header.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;flex-wrap:wrap}
header.bar b{font:700 17px var(--f-head)}
header.bar small{opacity:.85;margin-left:8px}
.bar-actions{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500;min-height:38px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.bar .btn{background:transparent;color:var(--accent-fg);border-color:rgba(255,255,255,.5)}
.bar .btn:hover{background:rgba(255,255,255,.15)}
main{padding-block:20px 48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.login{max-width:400px;margin:48px auto}
.login h1{font-size:22px;margin-bottom:4px}
.login p{color:var(--muted);margin:0 0 14px}
form{display:grid;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-weight:500;font-size:14px;min-width:0}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-height:40px}
textarea{min-height:60px;resize:vertical}
.msg{border-radius:8px;padding:10px 12px;font-size:14px}
.msg.err{background:var(--bad-bg);color:var(--bad)}.msg.ok{background:var(--good-bg);color:var(--good)}.msg.info{background:var(--info-bg);color:var(--info)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 16px;cursor:pointer;font-weight:500}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.cnt{display:inline-block;background:var(--warn-bg);color:var(--warn);border-radius:99px;padding:0 8px;font-size:12px;font-weight:600;margin-left:6px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools select{width:auto;min-width:150px}
.grow{flex:1}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.mono{font-variant-numeric:tabular-nums;white-space:nowrap}
.small{color:var(--muted);font-size:13px}
.kv{display:grid;gap:2px;font-size:13px;min-width:220px}
.kv span{color:var(--muted)}
td select,td textarea{min-width:130px}
a.tel{color:var(--accent);font-weight:600;text-decoration:none}
.row-new{background:color-mix(in srgb,var(--warn-bg) 45%,transparent)}
.empty{padding:32px 12px;text-align:center;color:var(--muted)}
.add{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end;margin-top:14px}
.hidden{display:none!important}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <div><b>উপজেলা এক্সপ্রেস</b><small id="upz"></small></div>
  <div class="bar-actions hidden" id="barActions"><span class="small" id="who" style="color:inherit;opacity:.85"></span><button class="btn" id="refresh">রিফ্রেশ</button><button class="btn" id="logout">লগআউট</button></div>
</div></header>

<main class="wrap">
  <section id="loginView" class="card login">
    <h1>অ্যাডমিন লগইন</h1><p>শুধু অনুমোদিত অ্যাডমিন ঢুকতে পারবেন।</p>
    <form id="loginForm">
      <label>ইমেইল<input id="email" type="email" autocomplete="username" required></label>
      <label>পাসওয়ার্ড<input id="password" type="password" autocomplete="current-password" required></label>
      <div id="loginMsg"></div>
      <button class="btn primary" type="submit" id="loginBtn">লগইন</button>
    </form>
  </section>

  <section id="appView" class="hidden">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabReq" aria-selected="true">অনুরোধ<span class="cnt hidden" id="newCnt"></span></button>
      <button class="tab" role="tab" id="tabRent" aria-selected="false">বাড়ি ভাড়ার বিজ্ঞপ্তি</button>
    </div>
    <div id="reqPane" class="card">
      <div class="tools">
        <select id="fStatus" aria-label="অবস্থা"><option value="">সব অবস্থা</option></select>
        <select id="fService" aria-label="সেবা"><option value="">সব সেবা</option></select>
        <span class="small grow" id="reqCount"></span>
      </div>
      <div id="reqMsg"></div>
      <div class="tablewrap" id="reqTable"></div>
    </div>
    <div id="rentPane" class="card hidden">
      <div id="rentMsg"></div>
      <div class="tablewrap" id="rentTable"></div>
      <h2 style="font-size:17px;margin-top:20px">নতুন বিজ্ঞপ্তি যোগ করুন</h2>
      <form class="add" id="rentForm">
        <label>শিরোনাম<input name="title" required placeholder="২ রুম টিনশেড বাসা"></label>
        <label>ধরন<select name="type"><option>বাসা</option><option>ফ্ল্যাট</option><option>রুম</option><option>দোকানঘর</option></select></label>
        <label>এলাকা<select name="area" id="rentArea"></select></label>
        <label>মাসিক ভাড়া (টাকা)<input name="rent" type="number" min="0" required inputmode="numeric"></label>
        <label>মালিকের নাম<input name="owner_name"></label>
        <label>মালিকের ফোন<input name="owner_phone" type="tel"></label>
        <button class="btn primary" type="submit">যোগ করুন</button>
      </form>
      <p class="small">যোগ করার পর বিজ্ঞপ্তি "যাচাই বাকি" থাকে। অবস্থা "প্রকাশিত" করলে তবেই গ্রাহকের সাইটে দেখা যাবে।</p>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script>
const C=window.UEX_CONFIG, API=C.SUPABASE_URL, KEY=C.SUPABASE_ANON_KEY;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BN='০১২৩৪৫৬৭৮৯', bn=n=>String(n).replace(/\d/g,d=>BN[d]);

const SVC={delivery:'ডেলিভারি',rent:'বাড়ি ভাড়া',worker:'দিনমজুর/মিস্ত্রি',technician:'টেকনিশিয়ান',shop:'দোকান',support:'অভিযোগ'};
const RST={new:'নতুন',called:'ফোন করা হয়েছে',assigned:'দায়িত্ব দেওয়া',done:'সম্পন্ন',cancelled:'বাতিল'};
const LST={pending:'যাচাই বাকি',published:'প্রকাশিত',rented:'ভাড়া হয়ে গেছে',hidden:'লুকানো'};
const XL={pickup:'কোথা থেকে',drop:'কোথায়',item:'কী',weight:'ওজন',cod:'ক্যাশ অন ডেলিভারি',mode:'কী চান',ptype:'ধরন',budget:'বাজেট',
  kind:'কাজ',count:'কত জন',days:'কত দিন',when:'কবে',problem:'সমস্যা',shop:'দোকান',items:'পণ্য',ref:'অর্ডার নং',cat:'ধরন',what:'বিস্তারিত'};

let S={tok:null,refresh:null,reqs:[],rent:[]};
try{S.tok=sessionStorage.getItem('uex_t');S.refresh=sessionStorage.getItem('uex_r')}catch(e){}
function saveSession(){try{sessionStorage.setItem('uex_t',S.tok||'');sessionStorage.setItem('uex_r',S.refresh||'')}catch(e){}}
function clearSession(){S.tok=S.refresh=null;try{sessionStorage.removeItem('uex_t');sessionStorage.removeItem('uex_r')}catch(e){}}

async function raw(path,opt={}){
  return fetch(API+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+(S.tok||KEY),'Content-Type':'application/json',...(opt.headers||{})}});
}
async function refreshToken(){
  if(!S.refresh) return false;
  try{
    const r=await fetch(API+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:S.refresh})});
    if(!r.ok) return false; const j=await r.json(); S.tok=j.access_token; S.refresh=j.refresh_token; saveSession(); return true;
  }catch(e){return false}
}
async function api(path,opt){
  let r=await raw(path,opt);
  if(r.status===401&&await refreshToken()) r=await raw(path,opt);
  if(r.status===401){logout('সেশন শেষ হয়েছে। আবার লগইন করুন।');throw new Error('401')}
  return r;
}

async function login(email,password){
  const r=await fetch(API+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  if(!r.ok) throw new Error('bad');
  const j=await r.json(); S.tok=j.access_token; S.refresh=j.refresh_token; saveSession();
}
async function isAdmin(){
  const r=await raw('/rest/v1/rpc/is_admin',{method:'POST',body:'{}'});
  return r.ok && (await r.json())===true;
}
function showLogin(msg){
  $('#loginView').classList.remove('hidden'); $('#appView').classList.add('hidden'); $('#barActions').classList.add('hidden');
  $('#loginMsg').innerHTML=msg?`<div class="msg err">${esc(msg)}</div>`:'';
}
function logout(msg){clearSession();S.reqs=[];S.rent=[];showLogin(msg||'')}

async function start(){
  $('#upz').textContent=C.UPAZILA_NAME+', '+C.DISTRICT_NAME;
  if(!API||!KEY){showLogin('config.js-এ Supabase-এর তথ্য বসানো হয়নি।');return}
  if(!S.tok){showLogin();return}
  try{
    if(!(await isAdmin())){ if(await refreshToken()&&await isAdmin()){} else {logout('সেশন শেষ বা আপনি অ্যাডমিন নন। আবার লগইন করুন।');return} }
    enter();
  }catch(e){logout()}
}
function enter(){
  $('#loginView').classList.add('hidden'); $('#appView').classList.remove('hidden'); $('#barActions').classList.remove('hidden');
  loadReqs(); loadRent();
}

/* ---------- অনুরোধ ---------- */
function fillFilters(){
  const a=$('#fStatus'), b=$('#fService');
  if(a.options.length<2) Object.entries(RST).forEach(([k,v])=>a.add(new Option(v,k)));
  if(b.options.length<2) Object.entries(SVC).forEach(([k,v])=>b.add(new Option(v,k)));
}
async function loadReqs(){
  fillFilters(); $('#reqMsg').innerHTML='';
  try{
    const r=await api('/rest/v1/service_requests?select=*&order=created_at.desc&limit=300');
    if(!r.ok) throw new Error(r.status);
    S.reqs=await r.json(); renderReqs();
  }catch(e){ if(e.message!=='401') $('#reqMsg').innerHTML='<div class="msg err">অনুরোধ আনা যায়নি। ইন্টারনেট দেখে রিফ্রেশ চাপুন।</div>' }
}
function when(t){try{return new Date(t).toLocaleString('bn-BD',{timeZone:'Asia/Dhaka',dateStyle:'medium',timeStyle:'short'})}catch(e){return t}}
function renderReqs(){
  const fs=$('#fStatus').value, fv=$('#fService').value;
  const rows=S.reqs.filter(x=>(!fs||x.status===fs)&&(!fv||x.service===fv));
  const nNew=S.reqs.filter(x=>x.status==='new').length;
  const c=$('#newCnt'); c.textContent=bn(nNew)+' নতুন'; c.classList.toggle('hidden',!nNew);
  $('#reqCount').textContent=bn(rows.length)+'টি অনুরোধ';
  if(!rows.length){$('#reqTable').innerHTML='<div class="empty">কোনো অনুরোধ নেই।</div>';return}
  $('#reqTable').innerHTML=`<table><thead><tr><th>নম্বর ও সময়</th><th>সেবা</th><th>গ্রাহক</th><th>বিবরণ</th><th>অবস্থা</th><th>অভ্যন্তরীণ নোট</th></tr></thead><tbody>
  ${rows.map(x=>{
    const ex=Object.entries(x.extra||{}).map(([k,v])=>`<div><span>${esc(XL[k]||k)}:</span> ${esc(v)}</div>`).join('');
    return `<tr class="${x.status==='new'?'row-new':''}"><td class="mono"><b>${esc(x.ref)}</b><div class="small">${esc(when(x.created_at))}</div></td>
     <td>${esc(SVC[x.service]||x.service)}</td>
     <td>${esc(x.name)}<div><a class="tel" href="tel:${esc(x.phone)}">${esc(x.phone)}</a></div><div class="small">${esc(x.area||'')}</div></td>
     <td><div class="kv">${ex}${x.details?`<div><span>নোট:</span> ${esc(x.details)}</div>`:''}</div></td>
     <td><select data-id="${x.id}" data-k="status" aria-label="অবস্থা">${Object.entries(RST).map(([k,v])=>`<option value="${k}"${k===x.status?' selected':''}>${v}</option>`).join('')}</select></td>
     <td><textarea data-id="${x.id}" data-k="admin_note" placeholder="কাকে দিলেন, কী হলো…">${esc(x.admin_note||'')}</textarea></td></tr>`}).join('')}
  </tbody></table>`;
}
async function patchReq(id,k,v){
  const x=S.reqs.find(r=>r.id===id); if(!x||x[k]===v) return;
  $('#reqMsg').innerHTML='';
  try{
    const r=await api('/rest/v1/service_requests?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({[k]:v||null})});
    if(!r.ok) throw new Error(r.status);
    x[k]=v||null; renderReqsKeepScroll();
  }catch(e){ if(e.message!=='401'){ $('#reqMsg').innerHTML='<div class="msg err">সেভ হয়নি। আবার চেষ্টা করুন।</div>'; loadReqs() } }
}
function renderReqsKeepScroll(){const y=window.scrollY;renderReqs();window.scrollTo(0,y)}

/* ---------- বাড়ি ভাড়া ---------- */
async function loadRent(){
  $('#rentArea').innerHTML=C.AREAS.map(a=>`<option>${esc(a)}</option>`).join('');
  try{
    const r=await api('/rest/v1/rent_listings?select=*&order=created_at.desc&limit=200');
    if(!r.ok) throw new Error(r.status);
    S.rent=await r.json(); renderRent();
  }catch(e){ if(e.message!=='401') $('#rentMsg').innerHTML='<div class="msg err">বিজ্ঞপ্তি আনা যায়নি।</div>' }
}
function renderRent(){
  if(!S.rent.length){$('#rentTable').innerHTML='<div class="empty">এখনো কোনো বিজ্ঞপ্তি নেই। নিচের ফর্ম থেকে যোগ করুন।</div>';return}
  $('#rentTable').innerHTML=`<table><thead><tr><th>বিজ্ঞপ্তি</th><th>এলাকা</th><th>ভাড়া</th><th>মালিক</th><th>অবস্থা</th></tr></thead><tbody>
  ${S.rent.map(x=>`<tr><td>${esc(x.title)}<div class="small">${esc(x.type)}</div></td><td>${esc(x.area)}</td><td class="mono">৳${bn(Number(x.rent).toLocaleString('en-US'))}</td>
   <td>${esc(x.owner_name||'')}<div class="small">${esc(x.owner_phone||'')}</div></td>
   <td><select data-rid="${x.id}" aria-label="অবস্থা">${Object.entries(LST).map(([k,v])=>`<option value="${k}"${k===x.status?' selected':''}>${v}</option>`).join('')}</select></td></tr>`).join('')}
  </tbody></table>`;
}

/* ---------- ইভেন্ট ---------- */
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault(); const b=$('#loginBtn'); b.disabled=true; b.textContent='যাচাই হচ্ছে…'; $('#loginMsg').innerHTML='';
  try{
    await login($('#email').value.trim(),$('#password').value);
    if(!(await isAdmin())){clearSession();throw new Error('notadmin')}
    $('#password').value=''; $('#who').textContent=$('#email').value.trim(); enter();
  }catch(err){
    $('#loginMsg').innerHTML=`<div class="msg err">${err.message==='notadmin'?'এই ইমেইল অ্যাডমিন হিসেবে যুক্ত করা নেই।':'ইমেইল বা পাসওয়ার্ড ভুল, অথবা ইন্টারনেট নেই।'}</div>`;
  }
  b.disabled=false; b.textContent='লগইন';
});
$('#logout').addEventListener('click',()=>logout());
$('#refresh').addEventListener('click',()=>{loadReqs();loadRent()});
$('#fStatus').addEventListener('change',renderReqs); $('#fService').addEventListener('change',renderReqs);
$('#tabReq').addEventListener('click',()=>tab('req')); $('#tabRent').addEventListener('click',()=>tab('rent'));
function tab(t){
  $('#reqPane').classList.toggle('hidden',t!=='req'); $('#rentPane').classList.toggle('hidden',t!=='rent');
  $('#tabReq').setAttribute('aria-selected',t==='req'); $('#tabRent').setAttribute('aria-selected',t==='rent');
}
$('#reqTable').addEventListener('change',e=>{const t=e.target; if(t.dataset.id) patchReq(t.dataset.id,t.dataset.k,t.value.trim())});
$('#rentTable').addEventListener('change',async e=>{
  const t=e.target; if(!t.dataset.rid) return;
  try{
    const r=await api('/rest/v1/rent_listings?id=eq.'+encodeURIComponent(t.dataset.rid),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:t.value})});
    if(!r.ok) throw new Error(r.status);
    S.rent.find(x=>x.id===t.dataset.rid).status=t.value; $('#rentMsg').innerHTML='<div class="msg ok">অবস্থা বদলানো হয়েছে।</div>';
  }catch(err){ if(err.message!=='401'){$('#rentMsg').innerHTML='<div class="msg err">সেভ হয়নি।</div>';loadRent()} }
});
$('#rentForm').addEventListener('submit',async e=>{
  e.preventDefault(); const fd=new FormData(e.target);
  const row={upazila_slug:C.UPAZILA_SLUG,title:String(fd.get('title')).trim(),type:fd.get('type'),area:fd.get('area'),rent:Number(fd.get('rent')),
    owner_name:String(fd.get('owner_name')||'').trim()||null,owner_phone:String(fd.get('owner_phone')||'').trim()||null,status:'pending'};
  try{
    const r=await api('/rest/v1/rent_listings',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(row)});
    if(!r.ok) throw new Error(r.status);
    e.target.reset(); $('#rentMsg').innerHTML='<div class="msg ok">বিজ্ঞপ্তি যোগ হয়েছে। প্রকাশ করতে অবস্থা "প্রকাশিত" করুন।</div>'; loadRent();
  }catch(err){ if(err.message!=='401') $('#rentMsg').innerHTML='<div class="msg err">যোগ করা যায়নি। সব ঘর পূরণ করেছেন কিনা দেখুন।</div>' }
});
setInterval(()=>{
  const typing=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#reqTable');
  if(S.tok&&!document.hidden&&!typing&&!$('#appView').classList.contains('hidden')) loadReqs();
},60000);
start();
</script>
