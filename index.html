<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JB Express — Order Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; background: #f4f6f9; color: #1f2937; padding: 20px; }
    .container { max-width: 640px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    h1 { margin-top: 0; font-size: 24px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
    input, textarea, select { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
    .pm-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 8px; }
    .pm-card { display: flex; align-items: center; gap: 8px; border: 1px solid #d1d5db; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; }
    .pm-card input { width: auto; margin: 0; }
    .wallet-box { display: none; margin-top: 14px; padding: 14px; background: #fef3c7; border: 1px solid #f59e0b; border-radius: 10px; }
    .wallet-number { font-size: 18px; font-weight: 700; color: #92400e; user-select: all; }
    .hint { font-size: 13px; color: #4b5563; margin: 6px 0 12px; }
    button.submit-btn { width: 100%; padding: 12px; background: #111827; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    button.submit-btn:hover { background: #374151; }
    .alert { margin-top: 16px; padding: 14px; border-radius: 8px; display: none; font-size: 14px; line-height: 1.5; }
    .alert.success { background: #dcfce7; color: #166534; border: 1px solid #86efac; display: block; }
    .alert.error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>JB Express — Place Order</h1>

    <form id="orderForm">
      <div class="form-group">
        <label for="customerName">Customer Name *</label>
        <input type="text" id="customerName" required placeholder="Apnar nam" />
      </div>

      <div class="form-group">
        <label for="customerPhone">Phone Number *</label>
        <input type="tel" id="customerPhone" required placeholder="01XXXXXXXXX" />
      </div>

      <div class="form-group">
        <label for="deliveryAddress">Delivery Address *</label>
        <textarea id="deliveryAddress" rows="2" required placeholder="Thikana likhun"></textarea>
      </div>

      <div class="form-group">
        <label for="orderItems">Order Details / Items *</label>
        <textarea id="orderItems" rows="3" required placeholder="Ki order korte chan ebong quantity"></textarea>
      </div>

      <div class="form-group">
        <label for="totalAmount">Total Amount (BDT) *</label>
        <input type="number" id="totalAmount" min="1" required placeholder="e.g. 500" />
      </div>

      <div class="form-group">
        <label>Select Payment Method *</label>
        <div class="pm-grid">
          <label class="pm-card">
            <input type="radio" name="paymentMethod" value="cod" checked />
            Cash on Delivery
          </label>
          <label class="pm-card">
            <input type="radio" name="paymentMethod" value="bkash" />
            bKash
          </label>
          <label class="pm-card">
            <input type="radio" name="paymentMethod" value="nagad" />
            Nagad
          </label>
          <label class="pm-card">
            <input type="radio" name="paymentMethod" value="rocket" />
            Rocket
          </label>
        </div>
      </div>

      <div id="walletPaymentBox" class="wallet-box">
        <div>Payment / Send Money Number: <span class="wallet-number">01409300070</span></div>
        <p class="hint">
          Uporer <strong>01409300070</strong> number-e selected wallet diye payment kore nicher box-e <strong>Transaction ID</strong> din.
          Payment korar por request admin panel-e jabe; admin check kore order confirm korben.
        </p>

        <div class="form-group">
          <label for="senderNumber">Apnar Payment Number (Optional)</label>
          <input type="text" id="senderNumber" placeholder="Je number theke payment korechen" />
        </div>

        <div class="form-group" style="margin-bottom:0;">
          <label for="txnId">Transaction ID (TxnID) *</label>
          <input type="text" id="txnId" placeholder="e.g. 8N7K2P9L1M" />
        </div>
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">Submit Order</button>
    </form>

    <div id="statusBox" class="alert"></div>
  </div>

  <!-- Jodi apnar zip-e config.js thake, tahole nicher 2 line use korte paren -->
  <!-- <script src="config.js"></script> -->
  <script>
    const SUPABASE_URL = window.SUPABASE_URL || "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || "YOUR_SUPABASE_ANON_KEY";
    const PAY_NUMBER = "01409300070";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const orderForm = document.getElementById("orderForm");
    const walletBox = document.getElementById("walletPaymentBox");
    const txnIdInput = document.getElementById("txnId");
    const senderNumberInput = document.getElementById("senderNumber");
    const submitBtn = document.getElementById("submitBtn");
    const statusBox = document.getElementById("statusBox");

    function getSelectedPaymentMethod() {
      return document.querySelector('input[name="paymentMethod"]:checked').value;
    }

    function togglePaymentFields() {
      const method = getSelectedPaymentMethod();
      const isWallet = method !== "cod";
      walletBox.style.display = isWallet ? "block" : "none";
      txnIdInput.required = isWallet;
      if (!isWallet) {
        txnIdInput.value = "";
        senderNumberInput.value = "";
      }
    }

    document.querySelectorAll('input[name="paymentMethod"]').forEach((radio) => {
      radio.addEventListener("change", togglePaymentFields);
    });

    function showMessage(type, html) {
      statusBox.className = `alert ${type}`;
      statusBox.innerHTML = html;
    }

    orderForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusBox.className = "alert";
      statusBox.innerHTML = "";

      const customerName = document.getElementById("customerName").value.trim();
      const customerPhone = document.getElementById("customerPhone").value.trim();
      const deliveryAddress = document.getElementById("deliveryAddress").value.trim();
      const orderItems = document.getElementById("orderItems").value.trim();
      const totalAmount = Number(document.getElementById("totalAmount").value);
      const method = getSelectedPaymentMethod();
      const isCod = method === "cod";
      const txnId = txnIdInput.value.trim();
      const senderNumber = senderNumberInput.value.trim();

      if (!isCod && !txnId) {
        showMessage("error", `${method.toUpperCase()} payment-er jonno Transaction ID obosshoi dite hobe.`);
        txnIdInput.focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";

      const payload = {
        customer_name: customerName,
        customer_phone: customerPhone,
        delivery_address: deliveryAddress,
        order_items: orderItems,
        total_amount: totalAmount,
        payment_method: method,
        payment_number: isCod ? null : (senderNumber || PAY_NUMBER),
        txn_id: isCod ? null : txnId,
        payment_status: isCod ? "cod_pending" : "pending_verification",
        status: isCod ? "confirmed" : "pending_verification"
      };

      const { data, error } = await db
        .from("orders")
        .insert([payload])
        .select()
        .single();

      submitBtn.disabled = false;
      submitBtn.textContent = "Submit Order";

      if (error) {
        showMessage("error", `Order submit korte somossa hoyeche: ${error.message}`);
        return;
      }

      if (isCod) {
        showMessage(
          "success",
          `<strong>Order Auto-Confirmed!</strong><br>Order ID: <code>${data.id}</code><br>Payment Method: Cash on Delivery (Delivery-r somoy payment diben).`
        );
      } else {
        showMessage(
          "success",
          `<strong>Payment Request Sent to Admin!</strong><br>Order ID: <code>${data.id}</code><br>Method: <strong>${method.toUpperCase()}</strong> | TxnID: <code>${txnId}</code><br>Admin payment check kore order confirm korben.`
        );
      }

      orderForm.reset();
      togglePaymentFields();
    });

    togglePaymentFields();
  </script>
</body>
</html>
