<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08734f">
<title>UPAZILA EXPRESS | জীবননগর</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --green:#08734f;
  --dark:#075b3e;
  --light:#e9f7f0;
  --orange:#f59e0b;
  --bg:#f5f7f6;
  --text:#202923;
  --muted:#6b7770;
  --border:#e5ebe7;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Hind Siliguri',sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
header{
  background:var(--green);
  color:white;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 3px 12px #0002;
}
.nav{
  max-width:1200px;
  margin:auto;
  padding:12px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
}
.logo{
  width:43px;height:43px;
  border-radius:12px;
  background:white;
  color:var(--green);
  display:grid;
  place-items:center;
  font-size:22px;
}
.brand h2{margin:0;font-size:21px;line-height:1.1}
.brand small{font-size:12px;opacity:.85}
.nav-actions{display:flex;gap:9px;align-items:center}
.nav-btn{
  border:1px solid #ffffff55;
  background:#ffffff18;
  color:white;
  border-radius:9px;
  padding:8px 12px;
  font-size:14px;
}
.hero{
  background:linear-gradient(120deg,#075b3e,#0b9865);
  color:white;
  padding:38px 18px 48px;
}
.hero-inner{max-width:1200px;margin:auto}
.hero h1{font-size:32px;margin:0 0 8px}
.hero p{margin:0;opacity:.92;font-size:16px}
.search-box{
  margin-top:22px;
  max-width:600px;
  display:flex;
  background:white;
  border-radius:12px;
  padding:5px;
  box-shadow:0 5px 18px #0002;
}
.search-box input{
  border:0;outline:0;flex:1;
  min-width:0;padding:10px 12px;
  font-size:15px;color:#222;
}
.search-box button{
  border:0;background:var(--orange);
  color:#222;padding:0 18px;
  border-radius:9px;font-weight:700;
}
.container{max-width:1200px;margin:auto;padding:22px 18px}
.section-title{
  display:flex;justify-content:space-between;
  align-items:center;gap:10px;
  margin-bottom:15px;
}
.section-title h2{margin:0;font-size:23px}
.section-title small{color:var(--muted)}
.categories{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:12px;
  margin-bottom:28px;
}
.cat{
  border:1px solid var(--border);
  background:white;
  border-radius:13px;
  padding:15px 7px;
  text-align:center;
  transition:.2s;
  color:var(--text);
}
.cat .ico{
  width:46px;height:46px;
  margin:0 auto 7px;
  border-radius:13px;
  display:grid;place-items:center;
  background:var(--light);
  color:var(--green);
  font-size:21px;
}
.cat strong{font-size:14px;display:block}
.cat.active,.cat:hover{
  border-color:var(--green);
  background:#f0faf5;
  transform:translateY(-2px);
}
.filters{
  display:flex;gap:8px;flex-wrap:wrap;
  margin:0 0 17px;
}
.filter{
  border:1px solid var(--border);
  background:white;
  border-radius:20px;
  padding:7px 15px;
  font-size:14px;
}
.filter.active{background:var(--green);color:white;border-color:var(--green)}
.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:17px;
}
.card{
  background:white;border:1px solid var(--border);
  border-radius:14px;overflow:hidden;
  box-shadow:0 3px 12px #00000008;
  display:flex;flex-direction:column;
}
.card-img{
  height:190px;width:100%;
  object-fit:cover;background:#e9efeb;
}
.no-image{
  height:150px;background:var(--light);
  display:grid;place-items:center;
  color:var(--green);font-size:42px;
}
.card-body{padding:14px;display:flex;flex-direction:column;flex:1}
.card h3{font-size:18px;margin:0 0 6px;line-height:1.4}
.description{
  color:var(--muted);font-size:14px;
  line-height:1.6;margin:4px 0 10px;
  white-space:pre-line;
}
.meta{
  display:flex;flex-wrap:wrap;gap:8px;
  color:var(--muted);font-size:13px;
  margin:4px 0 10px;
}
.meta span{display:flex;align-items:center;gap:5px}
.price{font-size:18px;color:var(--green);font-weight:700;margin:4px 0 12px}
.card-actions{display:flex;gap:8px;margin-top:auto}
.action-btn{
  flex:1;border:0;border-radius:9px;
  padding:9px 8px;font-size:14px;font-weight:600;
}
.primary{background:var(--green);color:white}
.secondary{background:var(--light);color:var(--green)}
.empty,.loading{
  background:white;border:1px dashed #cbd8d0;
  border-radius:13px;padding:35px 15px;
  text-align:center;color:var(--muted);
  grid-column:1/-1;
}
.empty i{font-size:35px;color:#9bb8a7;margin-bottom:10px}
footer{
  background:#123c2d;color:#e5f5ec;
  padding:28px 18px;margin-top:35px;
}
.footer-inner{
  max-width:1200px;margin:auto;
  display:flex;justify-content:space-between;
  gap:20px;flex-wrap:wrap;
}
footer p{margin:5px 0;font-size:14px}
footer a{color:#fff;text-decoration:underline}
.float-cart{
  position:fixed;right:20px;bottom:20px;
  z-index:120;background:var(--orange);
  color:#222;border:0;border-radius:50px;
  padding:13px 19px;font-weight:700;
  box-shadow:0 5px 20px #0003;
}
.cart-count{
  background:#d62828;color:white;
  padding:2px 7px;border-radius:20px;
  margin-left:5px;
}
.modal{
  display:none;position:fixed;inset:0;
  background:#0008;z-index:200;
  padding:15px;overflow:auto;
  align-items:center;justify-content:center;
}
.modal.show{display:flex}
.modal-box{
  background:white;width:100%;max-width:520px;
  border-radius:16px;padding:20px;
  max-height:92vh;overflow:auto;
}
.modal-head{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:15px;
}
.modal-head h2{margin:0;font-size:21px}
.close{
  border:0;background:#f0f2f1;
  width:34px;height:34px;border-radius:50%;
  font-size:18px;
}
.field{margin-bottom:12px}
.field label{display:block;font-weight:600;margin-bottom:5px}
.field input,.field textarea,.field select{
  width:100%;border:1px solid #dce5df;
  border-radius:9px;padding:11px;
  font-size:15px;outline:none;background:white;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--green)}
.field textarea{min-height:85px;resize:vertical}
.submit{
  width:100%;border:0;border-radius:10px;
  padding:12px;background:var(--green);
  color:white;font-size:16px;font-weight:700;
}
.cart-fee{padding:10px 12px;background:#eef7f1;border-radius:9px;margin:8px 0;font-weight:600;color:#075b3e}.cart-grand{font-size:20px;font-weight:800;text-align:right;margin:8px 0 14px;color:#075b3e}.cart-row{
  display:flex;justify-content:space-between;
  gap:10px;border-bottom:1px solid var(--border);
  padding:10px 0;
}
.qty{display:flex;align-items:center;gap:8px}
.qty button{
  border:0;background:var(--light);
  color:var(--green);border-radius:6px;
  width:27px;height:27px;font-weight:bold;
}
.total{text-align:right;font-size:19px;font-weight:700;margin:15px 0}
.notice{
  padding:10px 12px;border-radius:9px;
  background:#fff7e6;color:#805400;
  font-size:13px;margin:10px 0;line-height:1.5;
}
.pm-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
  margin-top:6px;
}
.pm-option{
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid #dce5df;
  border-radius:9px;
  padding:9px 10px;
  font-size:14px;
  font-weight:600;
  background:#fafcfb;
}
.pm-option input
