<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e21b70">
<title>উপজেলা এক্সপ্রেস | জীবননগর</title>
<meta name="description" content="জীবননগরের দৈনন্দিন সব প্রয়োজনের সেবা এক প্ল্যাটফর্মে।">

<style>
:root {
  --pink:#e21b70;
  --dark:#29212a;
  --light:#fff3f8;
  --gray:#777;
  --border:#f0e5eb;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Hind Siliguri',sans-serif;
  color:var(--dark);
  background:#fff;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.container{width:min(1120px,92%);margin:auto}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:10;
  background:white;
  border-bottom:1px solid var(--border);
}
.nav{
  height:72px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:18px;
  font-weight:700;
}
.logo-icon{
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  background:var(--pink);
  color:white;
  border-radius:13px;
  font-size:24px;
}
.logo small{
  display:block;
  font-size:10px;
  color:var(--pink);
  letter-spacing:1px;
}
.location{
  font-size:12px;
  color:var(--gray);
}
.location b{
  display:block;
  color:var(--dark);
  font-size:14px;
}
.call-btn{
  background:var(--light);
  color:var(--pink);
  border:1px solid #f4c4d9;
  padding:9px 15px;
  border-radius:10px;
  text-decoration:none;
  font-weight:700;
}

/* HERO */
.hero{
  margin:25px auto 0;
  background:linear-gradient(110deg,#fff0f6,#ffe0ed);
  border-radius:24px;
  padding:40px 6%;
  min-height:280px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  overflow:hidden;
}
.hero-content{max-width:620px}
.eyebrow{
  color:var(--pink);
  font-size:13px;
  font-weight:700;
}
.hero h1{
  font-size:clamp(30px,4.5vw,49px);
  line-height:1.2;
  margin:10px 0;
}
.hero h1 span{color:var(--pink)}
.hero p{
  color:#655a63;
  line-height:1.8;
}
.primary-btn{
  display:inline-block;
  background:var(--pink);
  color:white;
  border:0;
  border-radius:10px;
  padding:12px 22px;
  text-decoration:none;
  font-weight:700;
}
.hero-art{
  font-size:110px;
  padding:25px;
}

/* SEARCH */
.search-area{
  max-width:760px;
  margin:30px auto;
}
.search-area label{
  display:block;
  font-weight:700;
  margin-bottom:8px;
}
.search-box{
  display:flex;
  border:1px solid var(--border);
  border-radius:13px;
  padding:6px;
  box-shadow:0 5px 20px #00000008;
}
.search-box input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  padding:10px;
}
.search-box button{
  background:var(--pink);
  color:white;
  border:0;
  border-radius:9px;
  padding:9px 20px;
}

/* SECTIONS */
.section{margin:50px auto}
.section-heading{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:20px;
}
.section h2{font-size:25px;margin:4px 0}
.muted{font-size:12px;color:var(--gray)}

/* CATEGORIES */
.categories{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:12px;
}
.category{
  border:1px solid var(--border);
  border-radius:15px;
  padding:17px 7px;
  text-align:center;
  text-decoration:none;
  color:var(--dark);
  transition:.2s;
}
.category:hover{
  background:var(--light);
  border-color:#ed9cbe;
  transform:translateY(-3px);
}
.category-icon{
  width:50px;
  height:50px;
  margin:0 auto 10px;
  background:var(--light);
  border-radius:15px;
  display:grid;
  place-items:center;
  font-size:26px;
}
.category b{font-size:12px}

/* SERVICE CARDS */
.service-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}
.service-card{
  display:flex;
  gap:14px;
  padding:18px;
  border:1px solid var(--border);
  border-radius:16px;
  text-decoration:none;
  color:var(--dark);
  transition:.2s;
}
.service-card:hover{
  box-shadow:0 8px 25px #0000000c;
  transform:translateY(-2px);
}
.service-icon{
  width:55px;
  height:55px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:var(--light);
  font-size:27px;
}
.service-card h3{margin:0 0 5px;font-size:16px}
.service-card p{margin:0;color:var(--gray);font-size:12px}
.service-link{
  display:block;
  margin-top:8px;
  color:var(--pink);
  font-size:12px;
  font-weight:700;
}

/* HOW */
.how{
  margin:50px auto;
  padding:28px;
  border-radius:20px;
  background:#fff8fb;
}
.steps{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:20px;
}
.step{
  padding:16px;
  background:white;
  border:1px solid var(--border);
  border-radius:13px;
}
.step span{color:var(--pink);font-weight:700}
.step b{display:block}
.step small{color:var(--gray)}

/* PHONE */
.phone{
  background:var(--dark);
  color:white;
  border-radius:17px;
  padding:22px;
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:40px;
}
.phone h3{margin:0}
.phone p{margin:3px 0;color:#ddd;font-size:12px}
.phone button{
  margin-left:auto;
  background:white;
  color:var(--pink);
  border:0;
  border-radius:9px;
  padding:10px 15px;
  font-weight:700;
}

/* FOOTER */
footer{
  background:var(--dark);
  color:white;
  padding:30px 0;
}
footer p{color:#ccc;font-size:13px}
.footer-bottom{
  border-top:1px solid #514650;
  padding-top:12px;
  margin-top:15px;
  font-size:11px;
  color:#bbb;
  display:flex;
  justify-content:space-between;
}

/* REQUEST FORM */
.panel{
  border:1px solid var(--border);
  border-radius:17px;
  padding:25px;
  margin:25px auto 40px;
}
.back{
  display:inline-block;
  margin-top:20px;
  color:var(--pink);
  text-decoration:none;
}
.form{
  display:grid;
  gap:13px;
}
.form label{
  display:block;
  font-weight:600;
  font-size:13px;
}
.form input,.form select,.form textarea{
  width:100%;
  display:block;
  margin-top:5px;
  padding:11px;
  border:1px solid var(--border);
  border-radius:9px;
  outline-color:var(--pink);
}
.form textarea{min-height:85px}
.form button{
  width:100%;
  background:var(--pink);
  color:white;
  border:0;
  border-radius:10px;
  padding:13px;
  font-weight:700;
}
.form button:disabled{opacity:.6}
.msg{
  padding:12px;
  margin:12px 0;
  border-radius:9px;
  font-size:13px;
}
.error{background:#ffecec;color:#a22}
.success{background:#e5f7ed;color:#176d45}
.reference{
  color:var(--pink);
  font-size:23px;
  font-weight:700;
}
.hidden-field{
  position:absolute;
  left:-9999px;
}

@media(max-width:800px){
  .categories{grid-template-columns:repeat(3,1fr)}
  .service-grid{grid-template-columns:repeat(2,1fr)}
  .hero-art{font-size:75px}
}
@media(max-width:550px){
  .nav{height:65px}
  .location{font-size:10px}
  .location b{font-size:11px}
  .call-btn{font-size:11px;padding:8px}
  .hero{padding:25px 20px;min-height:245px}
  .hero h1{font-size:31px}
  .hero-art{display:none}
  .categories{gap:7px}
  .category{padding:12px 4px}
  .category-icon{width:42px;height:42px}
  .category b{font-size:10px}
  .service-grid{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
  .phone{padding:16px;gap:9px}
  .phone button{font-size:11px;padding:8px}
  .section h2{font-size:21px}
  .footer-bottom{flex-wrap:wrap;gap:8px}
}
</style>
</head>

const $ = id => document.getElementById(id);

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function generateReference(){
  return "UEX-" + Math.floor(100000 + Math.random()*900000);
}

function normalizePhone(value){
  let phone = String(value).replace(/[০-৯]/g,d=>"০১২৩৪৫৬৭৮৯".indexOf(d)).replace(/[\s\-+]/g,"");
  if(phone.startsWith("880")) phone=phone.slice(2);
  return /^01[3-9]\d{8}$/.test(phone) ? phone : null;
}

/* =========================================
   SUPABASE SUBMISSION
========================================= */

async function submitRequest(event){

event.preventDefault();

const form = event.target;
const button = $("submitButton");
const message = $("formMessage");

const data = new FormData(form);

const phone = normalizePhone(data.get("phone"));

if(!phone){
  message.innerHTML = '<div class="msg error">সঠিক মোবাইল নম্বর দিন।</div>';
  return;
}

if(!IS_CONNECTED){
  message.innerHTML = '<div class="msg error">Supabase সংযোগ পাওয়া যায়নি। config.js পরীক্ষা করুন।</div>';
  return;
}

const extra = {};

for(const [key,value] of data.entries()){
  if(!["name","phone","area","details"].includes(key)){
    extra[key] = value;
  }
}

const request = {
  ref: generateReference(),
  upazila_slug: CONFIG.UPAZILA_SLUG || "jibannagar",
  service: location.hash.replace("#",""),
  name: String(data.get("name")).trim(),
  phone: phone,
  area: data.get("area"),
  details: String(data.get("details") || "").trim() || null,
  extra: extra
};

button.disabled = true;
button.textContent = "অনুরোধ পাঠানো হচ্ছে...";

try{

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/service_requests",
    {
      method:"POST",
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer "+SUPABASE_KEY,
        "Content-Type":"application/json",
        "Prefer":"return=minimal"
      },
      body:JSON.stringify(request)
    }
  );

  if(!response.ok){
    const errorText = await response.text();
    console.error("Supabase error:",errorText);
    throw new Error("Database error");
  }

  $("app").innerHTML = `

  <div class="panel">
    <span class="eyebrow">অনুরোধ সফল</span>

    <h1>আপনার অনুরোধ পাওয়া গেছে!</h1>

    <p>আপনার অনুরোধ নম্বর:</p>

    <div class="reference">${request.ref}</div>

    <p>
      আমাদের প্রতিনিধি আপনার মোবাইল নম্বরে
      যোগাযোগ করবেন।
    </p>

    <a href="#home" class="primary-btn">
      হোমপেজে ফিরে যান
    </a>
  </div>

  `;

  window.scrollTo(0,0);

}catch(error){

  console.error(error);

  message.innerHTML = `
    <div class="msg error">
      অনুরোধ জমা হয়নি। ইন্টারনেট, Supabase
      এবং Database Policy পরীক্ষা করুন।
    </div>
  `;

  button.disabled = false;
  button.textContent = "আবার চেষ্টা করুন";

}

}

/* =========================================
   ROUTING
========================================= */

function renderPage(){

const page = location.hash.replace("#","");

if(SERVICES[page]){
  showService(page);
}else{
  showHome();
}

window.scrollTo(0,0);

}

window.addEventListener("hashchange",renderPage);

/* =========================================
   SETTINGS
========================================= */

if(CONFIG.UPAZILA_NAME){
  $("locationName").textContent =
    CONFIG.UPAZILA_NAME + ", " +
    (CONFIG.DISTRICT_NAME || "চুয়াডাঙ্গা");
}

if(CONFIG.HOTLINE){
  $("hotline").href = "tel:" + CONFIG.HOTLINE;
  $("hotline").textContent = "☎ " + CONFIG.HOTLINE;
}

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(console.error);
  });
}

renderPage();

</script>
</body>
</html>
