
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08734f">
<title>UPAZILA EXPRESS | Rider Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6f4;color:#17251d;font-family:'Hind Siliguri',sans-serif}
header{background:#08734f;color:white;padding:14px 4%;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header h2{margin:0;font-size:21px}
main{max-width:1050px;margin:20px auto;padding:0 14px}
.card{background:white;border:1px solid #dce5df;border-radius:13px;padding:17px;margin-bottom:15px}
.login{max-width:430px;margin:65px auto}
label{display:block;font-weight:600;margin:10px 0 4px}
input{width:100%;padding:11px;border:1px solid #dce5df;border-radius:8px;font:inherit}
button{border:0;background:#08734f;color:white;padding:10px 15px;border-radius:8px;font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.secondary{background:#e8f1eb;color:#08734f}
.danger{background:#b42318}
.blue{background:#1d4ed8}
.hidden{display:none!important}
.small{font-size:12px;color:#64736a;overflow-wrap:anywhere}
.msg{padding:11px;border-radius:8px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.error{background:#fee4e2;color:#b42318}
.success{background:#e0f5e8;color:#176b3c}
.warning{background:#fff3d8;color:#875000}
.order{border:1px solid #dce5df;border-radius:12px;padding:15px;margin:13px 0}
.order h3{margin:0 0 7px;color:#08734f}
.ordergrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:12px 0}
.info{background:#f5f8f6;padding:10px;border-radius:8px;overflow-wrap:anywhere}
.status{display:inline-block;padding:4px 10px;border-radius:20px;background:#e8f1eb;color:#08734f;font-size:13px}
.actionrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.itemtable{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.itemtable td,.itemtable th{padding:8px;border-bottom:1px solid #e5ebe6;text-align:left}
.itemtable th{background:#f5f8f6}
.stat{background:#f5f8f6;padding:12px;border-radius:9px;flex:1;min-width:120px}
.stat strong{display:block;font-size:24px;color:#08734f}
.stats{display:flex;gap:10px;flex-wrap:wrap}
a{color:#08734f}
@media(max-width:600px){.card{padding:12px}.order{padding:12px}}
</style>
</head>

<body>
<header>
  <div>
    <h2>🛵 UPAZILA EXPRESS</h2>
    <small>Rider Delivery Panel | জীবননগর</small>
  </div>
  <div class="actionrow">
    <button id="refreshBtn" class="secondary hidden">↻ Refresh</button>
    <button id="logoutBtn" class="danger hidden">লগআউট</button>
  </div>
</header>

<main>

<section id="loginView" class="card login">
  <h2>Rider Login</h2>
  <p class="small">আপনার Rider Email ও Password দিয়ে প্রবেশ করুন।</p>
  <form id="loginForm">
    <label>Email</label>
    <input id="email" type="email" required autocomplete="username">
    <label>Password</label>
    <input id="password" type="password" required autocomplete="current-password">
    <div id="loginMsg"></div>
    <button id="loginBtn" style="width:100%;margin-top:14px">লগইন করুন</button>
  </form>
</section>

<section id="dashboard" class="hidden">

  <div class="card">
    <h2>👤 Rider Profile</h2>
    <div id="profileInfo">লোড হচ্ছে...</div>
    <div id="gpsMsg"></div>
    <div class="actionrow">
      <button id="gpsBtn">📍 GPS চালু করুন</button>
      <button id="gpsStopBtn" class="secondary">GPS বন্ধ</button>
    </div>
  </div>

  <div class="card">
    <h2>📦 আমার অর্ডার</h2>
    <div class="stats">
      <div class="stat">নতুন Assign<strong id="assignedCount">০</strong></div>
      <div class="stat">চলমান<strong id="activeCount">০</strong></div>
      <div class="stat">Delivered<strong id="deliveredCount">০</strong></div>
    </div>
    <div id="orderMsg"></div>
    <div id="orderList">অর্ডার লোড হচ্ছে...</div>
  </div>

</section>
</main>

<script src="config.js"></script>

<script>
(function(){
'use strict';

const C=window.UEX_CONFIG||{};
const API=C.SUPABASE_URL;
const KEY=C.SUPABASE_ANON_KEY;
const $=id=>document.getElementById(id);

let token=null;
let refreshTokenValue=null;
let rider=null;
let orders=[];
let orderItems=[];
let providerAds=[];
let providerStores=[];
let gpsWatch=null;
let gpsTimer=null;
let loading=false;

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

const bn=v=>String(v??0).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);

function message(id,text,type){
  $(id).innerHTML=text
    ?'<div class="msg '+(type||'success')+'">'+esc(text)+'</div>':'';
}

function headers(extra){
  return {
    apikey:KEY,
    Authorization:'Bearer '+(token||KEY),
    'Content-Type':'application/json',
    ...(extra||{})
  };
}

async function signIn(email,password){
  const res=await fetch(API+'/auth/v1/token?grant_type=password',{
    method:'POST',
    headers:{apikey:KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email,password})
  });
  const data=await res.json();
  if(!res.ok)throw Error(data.msg||data.message||data.error_description||'Login ব্যর্থ হয়েছে।');
  token=data.access_token;
  refreshTokenValue=data.refresh_token;
  saveSession();
}

function saveSession(){
  sessionStorage.setItem('uex_rider_token',token);
  sessionStorage.setItem('uex_rider_refresh',refreshTokenValue);
}

async function refreshSession(){
  if(!refreshTokenValue)return false;

  const res=await fetch(API+'/auth/v1/token?grant_type=refresh_token',{
    method:'POST',
    headers:{apikey:KEY,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:refreshTokenValue})
  });

  if(!res.ok)return false;
  const data=await res.json();
  token=data.access_token;
  refreshTokenValue=data.refresh_token;
  saveSession();
  return true;
}

async function api(path,options={},retry=true){
  const res=await fetch(API+'/rest/v1/'+path,{
    ...options,
    headers:headers(options.headers)
  });

  if(res.status===401&&retry){
    if(await refreshSession())return api(path,options,false);
    throw Error('Session শেষ হয়েছে। আবার Login করুন।');
  }

  if(!res.ok){
    const body=await res.text();
    throw Error('Database Error ('+res.status+'): '+body);
  }

  if(res.status===204)return null;
  const body=await res.text();
  return body?JSON.parse(body):null;
}

/* LOGIN */

function showDashboard(){
  $('loginView').classList.add('hidden');
  $('dashboard').classList.remove('hidden');
  $('logoutBtn').classList.remove('hidden');
  $('refreshBtn').classList.remove('hidden');
}

async function loadRiderProfile(){
  const userRes=await fetch(API+'/auth/v1/user',{
    headers:headers()
  });
  if(!userRes.ok)throw Error('Login তথ্য যাচাই করা যায়নি।');

  const user=await userRes.json();

  const list=await api(
    'riders?auth_user_id=eq.'+encodeURIComponent(user.id)+
    '&select=id,auth_user_id,name,phone,email,vehicle_type,status'
  );

  if(!list||!list.length)throw Error('এই Login-এর সঙ্গে Rider Profile পাওয়া যায়নি।');

  rider=list[0];

  if(rider.status!=='active')
    throw Error('আপনার Rider Account বর্তমানে Active নয়। Admin-এর সঙ্গে যোগাযোগ করুন।');

  $('profileInfo').innerHTML=
    '<b>'+esc(rider.name)+'</b>'+
    '<div class="small">ফোন: '+esc(rider.phone||'')+
    ' | যানবাহন: '+esc(rider.vehicle_type||'')+
    ' | অবস্থা: Active</div>';
}

async function loginHandler(e){
  e.preventDefault();
  $('loginBtn').disabled=true;
  message('loginMsg','Login হচ্ছে...','success');

  try{
    if(!API||!KEY)throw Error('config.js-এ Supabase URL বা Publishable Key নেই।');

    await signIn($('email').value.trim(),$('password').value);
    await loadRiderProfile();

    $('password').value='';
    showDashboard();
    await loadOrders();
    startGPS();

  }catch(err){
    token=null;
    refreshTokenValue=null;
    rider=null;
    sessionStorage.removeItem('uex_rider_token');
    sessionStorage.removeItem('uex_rider_refresh');
    message('loginMsg',err.message,'error');
  }

  $('loginBtn').disabled=false;
}

/* ORDER LOADING */

async function loadOrders(){
  if(!rider||loading)return;
  loading=true;

  try{
    orders=await api(
      'customer_orders?assigned_rider_id=eq.'+
      encodeURIComponent(rider.id)+
      '&select=*&order=created_at.desc&limit=200'
    );

    const ids=orders.map(o=>o.id).filter(Boolean);

    if(ids.length){
      const inList='('+ids.join(',')+')';
      orderItems=await api(
        'order_items?order_id=in.'+encodeURIComponent(inList)+
        '&select=*&order=order_id'
      );

      // প্রতিটি order item-এর provider_ad_id থেকে দোকান/Provider-এর Pickup তথ্য আনা হয়।
      const adIds=[...new Set(orderItems.map(i=>i.provider_ad_id).filter(Boolean).map(String))];
      if(adIds.length){
        const adList='('+adIds.join(',')+')';
        providerAds=await api(
          'provider_ads?id=in.'+encodeURIComponent(adList)+
          '&select=id,provider_id,title,phone,area,category,status'
        );
        const providerIds=[...new Set((providerAds||[]).map(a=>a.provider_id).filter(Boolean).map(String))];
        if(providerIds.length){
          const providerList='('+providerIds.join(',')+')';
          providerStores=await api(
            'stores?provider_id=in.'+encodeURIComponent(providerList)+
            '&select=id,provider_id,name,phone,area'
          );
        }else providerStores=[];
      }else{
        providerAds=[];
        providerStores=[];
      }
    }else{
      orderItems=[];
      providerAds=[];
      providerStores=[];
    }

    renderOrders();

  }catch(err){
    message('orderMsg',err.message,'error');
  }finally{
    loading=false;
  }
}

function statusLabel(status){
  const labels={
    new:'নতুন',
    confirmed:'অর্ডার Confirm হয়েছে',
    assigned:'আপনার নামে Assign হয়েছে',
    on_the_way:'ডেলিভারি চলছে',
    delivered:'ডেলিভারি সম্পন্ন',
    cancelled:'বাতিল'
  };
  return labels[status]||status||'অজানা';
}

function renderOrders(){
  const assigned=orders.filter(o=>o.status==='assigned');
  const active=orders.filter(o=>['confirmed','on_the_way'].includes(o.status));
  const delivered=orders.filter(o=>o.status==='delivered');

  $('assignedCount').textContent=bn(assigned.length);
  $('activeCount').textContent=bn(active.length);
  $('deliveredCount').textContent=bn(delivered.length);

  if(!orders.length){
    $('orderList').innerHTML=
      '<div class="msg warning">এখনো আপনার নামে কোনো Order Assign করা হয়নি। Admin Assign করলে এখানে দেখা যাবে।</div>';
    return;
  }

  $('orderList').innerHTML=orders.map(o=>{
    const items=orderItems.filter(i=>String(i.order_id)===String(o.id));

    const itemHTML=items.length
      ?'<table class="itemtable"><thead><tr><th>পণ্য</th><th>পরিমাণ</th><th>দাম</th><th>মোট</th></tr></thead><tbody>'+
        items.map(i=>'<tr>'+
          '<td>'+esc(i.product_name||'পণ্য')+'</td>'+
          '<td>'+bn(i.quantity||1)+'</td>'+
          '<td>৳'+bn(i.unit_price||0)+'</td>'+
          '<td>৳'+bn(i.line_total||0)+'</td>'+
        '</tr>').join('')+
        '</tbody></table>'
      :'<div class="small">পণ্যের আলাদা বিবরণ পাওয়া যায়নি।</div>';

    // এই Order-এর item অনুযায়ী কোন Provider-এর কাছ থেকে পণ্য নিতে হবে তা সাজানো।
    const orderAds=items.map(item=>{
      const ad=(providerAds||[]).find(a=>String(a.id)===String(item.provider_ad_id));
      if(!ad)return null;
      const store=(providerStores||[]).find(st=>String(st.provider_id)===String(ad.provider_id));
      return {ad,store};
    }).filter(Boolean);
    const providerMap={};
    orderAds.forEach(x=>{
      const key=String(x.ad.provider_id);
      if(!providerMap[key])providerMap[key]={...x,products:[]};
      providerMap[key].products.push(x.ad.title||'পণ্য');
    });
    const pickupHTML=Object.keys(providerMap).length
      ?Object.values(providerMap).map(x=>{
        const name=x.store?.name||'দোকানের নাম পাওয়া যায়নি';
        const phone=x.store?.phone||x.ad.phone||'';
        const area=x.store?.area||x.ad.area||'';
        const map=area
          ?'<br><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(area)+'">📍 Pickup Map-এ দেখুন</a>':'';
        return '<div class="info" style="margin:8px 0"><b>🏪 '+esc(name)+'</b><br>'+
          '<span class="small">পণ্য: '+esc(x.products.join(', '))+'</span><br>'+
          (phone?'<a href="tel:'+encodeURIComponent(phone)+'">📞 '+esc(phone)+'</a>':'<span class="small">Provider ফোন পাওয়া যায়নি</span>')+
          '<br>Pickup ঠিকানা: '+esc(area||'ঠিকানা পাওয়া যায়নি')+map+'</div>';
      }).join('')
      :'<div class="msg warning">এই অর্ডারের পণ্যের সঙ্গে Provider/Pickup তথ্য যুক্ত পাওয়া যায়নি। Admin-কে Provider-এর দোকান থেকে পণ্য সংগ্রহের তথ্য যাচাই করতে বলুন।</div>';

    const rawNote=String(o.customer_note||'');
    const riderChargeMatch=rawNote.match(/\[RIDER_CHARGE=(\d+(?:\.\d+)?)\]/);
    const riderCharge=riderChargeMatch?riderChargeMatch[1]:null;
    const customerNote=rawNote.replace(/\s*\[RIDER_CHARGE=\d+(?:\.\d+)?\]/g,'').trim();

    const canConfirm=o.status==='assigned';
    const canStart=o.status==='confirmed';
    const canDeliver=o.status==='on_the_way';

    let actions='';

    if(canConfirm){
      actions+='<button data-action="confirmed" data-id="'+esc(o.id)+'">অর্ডার Confirm</button>';
    }
    if(canStart){
      actions+='<button class="blue" data-action="on_the_way" data-id="'+esc(o.id)+'">🚚 ডেলিভারি শুরু</button>';
    }
    if(canDeliver){
      actions+='<button data-action="delivered" data-id="'+esc(o.id)+'">✓ Delivered</button>';
    }

    const phone=o.customer_phone
      ?'<a href="tel:'+encodeURIComponent(o.customer_phone)+'">📞 '+esc(o.customer_phone)+'</a>'
      :'ফোন নম্বর নেই';

    const mapLink=o.delivery_address
      ?'<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((o.delivery_address||'')+' '+(o.area||''))+'">📍 ঠিকানা Map-এ দেখুন</a>'
      :'';

    return '<div class="order">'+
      '<h3>Order: '+esc(o.ref||o.id)+'</h3>'+
      '<span class="status">'+esc(statusLabel(o.status))+'</span>'+
      '<div class="small">তারিখ: '+esc(o.created_at||'')+'</div>'+
      '<h4>🏪 পণ্য সংগ্রহের স্থান — Provider</h4>'+pickupHTML+
      '<h4>👤 পণ্য পৌঁছে দেওয়ার স্থান — Customer</h4>'+
      '<div class="ordergrid">'+
        '<div class="info"><b>Customer</b><br>'+esc(o.customer_name||'নাম নেই')+'</div>'+
        '<div class="info"><b>মোবাইল</b><br>'+phone+'</div>'+
        '<div class="info"><b>ডেলিভারি ঠিকানা</b><br>'+esc(o.delivery_address||'')+'<br>'+esc(o.area||'')+'<br>'+mapLink+'</div>'+
        '<div class="info"><b>পণ্যের মূল্য</b><br><strong>৳'+bn(o.total_amount||0)+'</strong></div>'+
        (riderCharge!==null?'<div class="info"><b>Rider Charge</b><br><strong>৳'+bn(riderCharge)+'</strong></div>':'')+
        (o.grand_total!==undefined?'<div class="info"><b>সর্বমোট</b><br><strong>৳'+bn(o.grand_total)+'</strong></div>':'')+
      '</div>'+
      '<b>Customer Note:</b><div>'+esc(customerNote||'কোনো নির্দেশনা নেই')+'</div>'+
      '<h4>🛍️ অর্ডারের পণ্য</h4>'+itemHTML+
      '<div class="actionrow">'+actions+'</div>'+
    '</div>';
  }).join('');
}

/* ORDER STATUS UPDATE */

async function updateOrderStatus(id,status){
  const order=orders.find(o=>String(o.id)===String(id));
  if(!order)throw Error('Order পাওয়া যায়নি।');

  const allowed={
    assigned:['confirmed'],
    confirmed:['on_the_way'],
    on_the_way:['delivered']
  };

  if(!(allowed[order.status]||[]).includes(status))
    throw Error('এই Order-এর জন্য Status পরিবর্তন অনুমোদিত নয়।');

  if(status==='delivered'&&!confirm('এই Order কি Customer-এর কাছে পৌঁছে দিয়েছেন?'))
    return;

  const update={status};

  if(status==='on_the_way')
    update.tracking_started_at=new Date().toISOString();

  if(status==='delivered'){
    update.delivered_at=new Date().toISOString();
    update.tracking_stopped_at=new Date().toISOString();
  }

  await api(
    'customer_orders?id=eq.'+encodeURIComponent(id)+
    '&assigned_rider_id=eq.'+encodeURIComponent(rider.id),
    {
      method:'PATCH',
      headers:{Prefer:'return=minimal'},
      body:JSON.stringify(update)
    }
  );

  message('orderMsg','Order Status পরিবর্তন হয়েছে: '+statusLabel(status),'success');
  await loadOrders();
}

$('orderList').addEventListener('click',async e=>{
  const btn=e.target.closest('button[data-action]');
  if(!btn)return;

  const id=btn.dataset.id;
  const status=btn.dataset.action;

  btn.disabled=true;
  try{
    await updateOrderStatus(id,status);
  }catch(err){
    message('orderMsg',err.message,'error');
  }finally{
    btn.disabled=false;
  }
});

/* GPS TRACKING */

function startGPS(){
  if(!rider)return;

  if(!navigator.geolocation){
    message('gpsMsg','এই Browser-এ GPS সুবিধা নেই।','error');
    return;
  }

  if(gpsWatch!==null)navigator.geolocation.clearWatch(gpsWatch);

  message('gpsMsg','GPS চালু হচ্ছে...','success');

  gpsWatch=navigator.geolocation.watchPosition(
    saveLocation,
    err=>{
      const messages={
        1:'GPS Permission দেওয়া হয়নি। Browser থেকে Location Allow করুন।',
        2:'আপনার GPS Location পাওয়া যাচ্ছে না।',
        3:'GPS পেতে সময় শেষ হয়েছে। আবার চেষ্টা করুন।'
      };
      message('gpsMsg',messages[err.code]||err.message,'error');
    },
    {
      enableHighAccuracy:true,
      maximumAge:5000,
      timeout:20000
    }
  );
}

async function saveLocation(position){
  if(!rider||!token)return;

  const c=position.coords;

  const payload={
    rider_id:rider.id,
    latitude:c.latitude,
    longitude:c.longitude,
    accuracy:c.accuracy||null,
    heading:c.heading||null,
    speed:c.speed||null,
    updated_at:new Date().toISOString()
  };

  try{
    await api('rider_locations?on_conflict=rider_id',{
      method:'POST',
      headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify(payload)
    });

    message(
      'gpsMsg',
      '✓ GPS চালু আছে। সর্বশেষ অবস্থান: '+new Date().toLocaleTimeString('bn-BD'),
      'success'
    );
  }catch(err){
    message('gpsMsg','GPS সংরক্ষণ হয়নি: '+err.message,'error');
  }
}

function stopGPS(){
  if(gpsWatch!==null){
    navigator.geolocation.clearWatch(gpsWatch);
    gpsWatch=null;
  }
  message('gpsMsg','GPS Tracking বন্ধ করা হয়েছে।','warning');
}

/* LOGOUT */

function logout(){
  stopGPS();
  if(gpsTimer)clearInterval(gpsTimer);

  token=null;
  refreshTokenValue=null;
  rider=null;
  orders=[];
  orderItems=[];
  providerAds=[];
  providerStores=[];

  sessionStorage.removeItem('uex_rider_token');
  sessionStorage.removeItem('uex_rider_refresh');

  $('dashboard').classList.add('hidden');
  $('loginView').classList.remove('hidden');
  $('logoutBtn').classList.add('hidden');
  $('refreshBtn').classList.add('hidden');
  $('password').value='';
  message('loginMsg','','success');
}

/* BUTTONS */

$('loginForm').addEventListener('submit',loginHandler);
$('logoutBtn').addEventListener('click',logout);
$('refreshBtn').addEventListener('click',loadOrders);
$('gpsBtn').addEventListener('click',startGPS);
$('gpsStopBtn').addEventListener('click',stopGPS);

/* SESSION RESTORE */

async function init(){
  if(!API||!KEY){
    message('loginMsg','config.js-এ Supabase URL বা Publishable Key নেই।','error');
    return;
  }

  const saved=sessionStorage.getItem('uex_rider_token');
  const savedRefresh=sessionStorage.getItem('uex_rider_refresh');

  if(!saved||!savedRefresh)return;

  token=saved;
  refreshTokenValue=savedRefresh;

  try{
    const userRes=await fetch(API+'/auth/v1/user',{
      headers:headers()
    });

    if(!userRes.ok){
      if(!(await refreshSession()))throw Error('আবার Login করুন।');
    }

    await loadRiderProfile();
    showDashboard();
    await loadOrders();
    startGPS();

  }catch(err){
    logout();
    message('loginMsg',err.message,'error');
  }
}

/* প্রতি ১০ সেকেন্ডে নতুন Order Refresh */
setInterval(()=>{
  if(token&&rider&&!document.hidden)loadOrders();
},10000);

init();

})();
</script>
