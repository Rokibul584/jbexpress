
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UPAZILA EXPRESS | Rider</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f6f3;color:#183126;font-family:'Hind Siliguri',sans-serif}
header{background:#08734f;color:white;padding:16px}
main{max-width:650px;margin:25px auto;padding:0 14px}
.card{background:white;border:1px solid #dce8df;border-radius:14px;padding:20px;margin-bottom:15px}
h2{margin:0 0 8px}
label{display:block;margin:12px 0 5px;font-weight:600}
input{width:100%;padding:12px;border:1px solid #ccd9d0;border-radius:8px;font:inherit}
button{background:#08734f;color:white;border:0;border-radius:8px;padding:11px 18px;font:inherit;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#e5f1e9;color:#08734f}
.hidden{display:none!important}
.msg{padding:11px;border-radius:8px;margin:12px 0;background:#e7f2eb;white-space:pre-wrap}
.error{background:#fee7e5;color:#a51d16}
.success{background:#e1f5e8;color:#176b3c}
.status{font-weight:600;color:#08734f}
.small{font-size:13px;color:#64756b}
</style>
</head>
<body>
<header>
  <h2>🛵 UPAZILA EXPRESS</h2>
  <div>Rider Panel | জীবননগর</div>
</header>

<main>
<section id="loginBox" class="card">
  <h2>Rider Login</h2>
  <p class="small">Admin থেকে দেওয়া Email ও Password দিয়ে প্রবেশ করুন।</p>
  <form id="loginForm">
    <label>Email</label>
    <input id="email" type="email" required autocomplete="username">
    <label>Password</label>
    <input id="password" type="password" required autocomplete="current-password">
    <div id="loginMsg"></div>
    <button id="loginBtn" type="submit">লগইন করুন</button>
  </form>
</section>

<section id="panel" class="hidden">
  <div class="card">
    <h2 id="riderName">Rider</h2>
    <div id="riderPhone" class="small"></div>
    <p>GPS অবস্থা: <span id="gpsStatus" class="status">বন্ধ</span></p>
    <div id="gpsMsg" class="msg">GPS চালু করতে নিচের বাটনে চাপ দিন।</div>
    <button id="startBtn">📍 Live Location চালু করুন</button>
    <button id="stopBtn" class="secondary" disabled>Location বন্ধ করুন</button>
    <button id="logoutBtn" class="secondary">লগআউট</button>
  </div>

  <div class="card">
    <h3>আপনার বর্তমান অবস্থান</h3>
    <div id="coordinates">এখনো GPS পাওয়া যায়নি।</div>
    <p class="small">GPS পাঠানোর জন্য Rider-এর ফোনে Location চালু এবং এই পেজ খোলা রাখতে হবে।</p>
  </div>
</section>
</main>

<script src="config.js"></script>
<script>
(function(){
'use strict';

const C=window.UEX_CONFIG||{};
const API=C.SUPABASE_URL;
const KEY=C.SUPABASE_ANON_KEY;
const $=id=>document.getElementById(id);

let token=null;
let userId=null;
let rider=null;
let watchId=null;
let lastSent=0;
let sending=false;

function message(id,text,type){
  const el=$(id);
  el.className='msg '+(type||'');
  el.textContent=text;
}

function headers(){
  return {
    apikey:KEY,
    Authorization:'Bearer '+token,
    'Content-Type':'application/json'
  };
}

async function request(path,options={}){
  const res=await fetch(API+path,{
    ...options,
    headers:{...headers(),...(options.headers||{})}
  });
  const text=await res.text();
  let data={};
  try{data=text?JSON.parse(text):{};}catch(e){}
  if(!res.ok)throw Error(data.message||data.error_description||data.hint||text||'Request failed');
  return data;
}

async function login(email,password){
  const res=await fetch(API+'/auth/v1/token?grant_type=password',{
    method:'POST',
    headers:{apikey:KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email,password})
  });
  const data=await res.json();
  if(!res.ok)throw Error(data.msg||data.message||data.error_description||'Login ব্যর্থ হয়েছে');

  token=data.access_token;
  userId=data.user.id;

  const profiles=await request(
    '/rest/v1/riders?auth_user_id=eq.'+
    encodeURIComponent(userId)+'&select=id,name,phone,status'
  );

  if(!profiles.length){
    token=null;
    throw Error('এই Login-এর সঙ্গে Rider Profile পাওয়া যায়নি। Admin-এর সঙ্গে যোগাযোগ করুন।');
  }

  rider=profiles[0];

  if(rider.status!=='active'){
    token=null;
    throw Error('আপনার Rider Account বর্তমানে Active নয়। Admin-এর সঙ্গে যোগাযোগ করুন।');
  }

  sessionStorage.setItem('uex_rider_token',token);
  sessionStorage.setItem('uex_rider_uid',userId);
  showPanel();
}

function showPanel(){
  $('loginBox').classList.add('hidden');
  $('panel').classList.remove('hidden');
  $('riderName').textContent=rider.name;
  $('riderPhone').textContent=rider.phone||'';
}

async function sendLocation(position){
  if(sending||!rider||!token)return;

  const now=Date.now();
  if(now-lastSent<10000)return;

  sending=true;
  const c=position.coords;

  const row={
    rider_id:rider.id,
    latitude:c.latitude,
    longitude:c.longitude,
    accuracy:c.accuracy,
    heading:c.heading,
    speed:c.speed,
    updated_at:new Date().toISOString()
  };

  try{
    await request('/rest/v1/rider_locations',{
      method:'POST',
      headers:{Prefer:'return=minimal'},
      body:JSON.stringify(row)
    });

    lastSent=now;
    $('gpsStatus').textContent='চালু — Location পাঠানো হচ্ছে';
    $('coordinates').textContent=
      'Latitude: '+c.latitude.toFixed(6)+
      '\nLongitude: '+c.longitude.toFixed(6)+
      '\nAccuracy: '+Math.round(c.accuracy)+' মিটার';
    message('gpsMsg','আপনার Live Location Admin-এর কাছে পাঠানো হচ্ছে।','success');
  }catch(error){
    message('gpsMsg','GPS পাঠানো যায়নি: '+error.message,'error');
  }finally{
    sending=false;
  }
}

function gpsError(error){
  let text='GPS পাওয়া যায়নি।';
  if(error.code===1)text='Location permission দেওয়া হয়নি। ফোনের Browser Settings থেকে Location অনুমতি দিন।';
  if(error.code===2)text='আপনার GPS অবস্থান পাওয়া যাচ্ছে না। ফোনের Location চালু করুন।';
  if(error.code===3)text='GPS পেতে সময় লাগছে। আবার চেষ্টা করুন।';
  message('gpsMsg',text,'error');
  $('gpsStatus').textContent='সমস্যা';
}

function startGPS(){
  if(!navigator.geolocation){
    message('gpsMsg','এই Browser GPS সমর্থন করে না।','error');
    return;
  }

  if(!window.isSecureContext){
    message('gpsMsg','GPS ব্যবহারের জন্য HTTPS ওয়েবসাইট প্রয়োজন।','error');
    return;
  }

  if(watchId!==null)return;

  message('gpsMsg','GPS Permission চাওয়া হচ্ছে...','');
  watchId=navigator.geolocation.watchPosition(
    sendLocation,
    gpsError,
    {enableHighAccuracy:true,maximumAge:5000,timeout:20000}
  );

  $('startBtn').disabled=true;
  $('stopBtn').disabled=false;
}

function stopGPS(){
  if(watchId!==null){
    navigator.geolocation.clearWatch(watchId);
    watchId=null;
  }
  $('gpsStatus').textContent='বন্ধ';
  $('startBtn').disabled=false;
  $('stopBtn').disabled=true;
  message('gpsMsg','আপনার GPS পাঠানো বন্ধ হয়েছে।','');
}

function logout(){
  stopGPS();
  token=null;
  userId=null;
  rider=null;
  sessionStorage.removeItem('uex_rider_token');
  sessionStorage.removeItem('uex_rider_uid');
  $('panel').classList.add('hidden');
  $('loginBox').classList.remove('hidden');
  $('password').value='';
}

$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  $('loginBtn').disabled=true;
  message('loginMsg','লগইন হচ্ছে...','');
  try{
    if(!API||!KEY)throw Error('config.js পাওয়া যায়নি।');
    await login($('email').value.trim(),$('password').value);
    $('password').value='';
  }catch(error){
    message('loginMsg',error.message,'error');
  }
  $('loginBtn').disabled=false;
});

$('startBtn').addEventListener('click',startGPS);
$('stopBtn').addEventListener('click',stopGPS);
$('logoutBtn').addEventListener('click',logout);

async function restore(){
  const saved=sessionStorage.getItem('uex_rider_token');
  const uid=sessionStorage.getItem('uex_rider_uid');
  if(!saved||!uid)return;

  token=saved;
  userId=uid;
  try{
    const user=await request('/auth/v1/user');
    userId=user.id;
    const profiles=await request(
      '/rest/v1/riders?auth_user_id=eq.'+
      encodeURIComponent(userId)+'&select=id,name,phone,status'
    );
    if(!profiles.length||profiles[0].status!=='active')throw Error('Rider Account Active নয়।');
    rider=profiles[0];
    showPanel();
  }catch(error){
    logout();
    message('loginMsg','আবার Login করুন। '+error.message,'error');
  }
}

restore();
})();
</script>
</body>
</html>
