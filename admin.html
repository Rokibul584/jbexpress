<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JB Express — Admin Order & Payment Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; background: #f3f4f6; color: #111827; padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; }
    .topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 24px; }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; }
    select, button { padding: 9px 14px; border-radius: 8px; border: 1px solid #d1d5db; font-size: 14px; cursor: pointer; }
    button.primary { background: #111827; color: #fff; border-color: #111827; }
    button.verify-btn { background: #16a34a; color: #fff; border: none; font-weight: 600; }
    button.verify-btn:hover { background: #15803d; }
    .table-wrap { background: #fff; border-radius: 12px; overflow-x: auto; box-shadow: 0 4px 14px rgba(0,0,0,0.05); }
    table { width: 100%; border-collapse: collapse; min-width: 860px; }
    th, td { padding: 12px 14px; border-bottom: 1px solid #e5e7eb; text-align: left; font-size: 14px; vertical-align: top; }
    th { background: #f9fafb; font-weight: 700; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; }
    .b-pending { background: #fef3c7; color: #92400e; }
    .b-confirmed { background: #dcfce7; color: #166534; }
    .b-cod { background: #dbeafe; color: #1e40af; }
    .empty { padding: 24px; text-align: center; color: #6b7280; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>JB Express — Admin Panel</h1>
      <div class="controls">
        <select id="filterSelect">
          <option value="all">All Orders</option>
          <option value="pending_verification">Pending Payment Verification</option>
          <option value="cod">Cash on Delivery (Auto Confirmed)</option>
          <option value="confirmed">Confirmed Orders</option>
        </select>
        <button class="primary" id="refreshBtn">Refresh Orders</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Order Info</th>
            <th>Customer</th>
            <th>Items & Amount</th>
            <th>Payment & TxnID</th>
            <th>Order Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="ordersBody">
          <tr><td colspan="6" class="empty">Loading orders...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Jodi apnar zip-e config.js thake, tahole nicher 2 line use korte paren -->
  <!-- <script src="config.js"></script> -->
  <script>
    const SUPABASE_URL = window.SUPABASE_URL || "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || "YOUR_SUPABASE_ANON_KEY";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const ordersBody = document.getElementById("ordersBody");
    const filterSelect = document.getElementById("filterSelect");
    const refreshBtn = document.getElementById("refreshBtn");

    let allOrders = [];

    function escapeHtml(str = "") {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function loadOrders() {
      ordersBody.innerHTML = `<tr><td colspan="6" class="empty">Loading orders...</td></tr>`;

      const { data, error } = await db
        .from("orders")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        ordersBody.innerHTML = `<tr><td colspan="6" class="empty">Error loading orders: ${escapeHtml(error.message)}</td></tr>`;
        return;
      }

      allOrders = data || [];
      renderFilteredOrders();
    }

    function renderFilteredOrders() {
      const filter = filterSelect.value;
      let list = allOrders;

      if (filter === "pending_verification") {
        list = allOrders.filter((o) => o.payment_status === "pending_verification");
      } else if (filter === "cod") {
        list = allOrders.filter((o) => o.payment_method === "cod");
      } else if (filter === "confirmed") {
        list = allOrders.filter((o) => o.status === "confirmed");
      }

      if (!list.length) {
        ordersBody.innerHTML = `<tr><td colspan="6" class="empty">Kono order pawa jayni.</td></tr>`;
        return;
      }

      ordersBody.innerHTML = list.map((order) => {
        const isCod = order.payment_method === "cod";
        const isPendingVerify = !isCod && order.payment_status === "pending_verification";

        const paymentHtml = isCod
          ? `<span class="badge b-cod">COD (Auto Confirmed)</span>`
          : `
            <div><strong>Method:</strong> ${escapeHtml((order.payment_method || "").toUpperCase())}</div>
            <div><strong>TxnID:</strong> <code>${escapeHtml(order.txn_id || "N/A")}</code></div>
            ${order.payment_number ? `<div><strong>From:</strong> ${escapeHtml(order.payment_number)}</div>` : ""}
            <div style="margin-top:4px;">
              <span class="badge ${isPendingVerify ? "b-pending" : "b-confirmed"}">
                ${escapeHtml(order.payment_status || "unknown")}
              </span>
            </div>
          `;

        const statusBadgeClass = order.status === "confirmed" ? "b-confirmed" : "b-pending";
        const statusHtml = `<span class="badge ${statusBadgeClass}">${escapeHtml(order.status || "pending")}</span>`;

        const actionHtml = isPendingVerify
          ? `<button class="verify-btn" onclick="verifyAndConfirmOrder('${escapeHtml(order.id)}')">Verify & Confirm Order</button>`
          : `<span>${order.status === "confirmed" ? "Confirmed" : "—"}</span>`;

        return `
          <tr>
            <td>
              <div><code>${escapeHtml(order.id)}</code></div>
              <small>${order.created_at ? new Date(order.created_at).toLocaleString() : ""}</small>
            </td>
            <td>
              <div><strong>${escapeHtml(order.customer_name || "")}</strong></div>
              <div>${escapeHtml(order.customer_phone || "")}</div>
              <small>${escapeHtml(order.delivery_address || "")}</small>
            </td>
            <td>
              <div>${escapeHtml(order.order_items || "")}</div>
              <div><strong>Total:</strong> ${escapeHtml(order.total_amount ?? 0)} BDT</div>
            </td>
            <td>${paymentHtml}</td>
            <td>${statusHtml}</td>
            <td>${actionHtml}</td>
          </tr>
        `;
      }).join("");
    }

    window.verifyAndConfirmOrder = async function (orderId) {
      const ok = confirm("Apni ki payment TxnID check korechen? Confirm korle order 'confirmed' hoye jabe.");
      if (!ok) return;

      const { error } = await db
        .from("orders")
        .update({
          payment_status: "verified",
          status: "confirmed"
        })
        .eq("id", orderId);

      if (error) {
        alert("Order confirm korte somossa hoyeche: " + error.message);
        return;
      }

      alert("Payment verified ebong order confirmed!");
      await loadOrders();
    };

    filterSelect.addEventListener("change", renderFilteredOrders);
    refreshBtn.addEventListener("click", loadOrders);

    loadOrders();
  </script>
</body>
</html>
